<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title id="pageTitle">سووڕی مانگانە</title>
<meta name="description" content="ئەپڵیکەیشنی کوردی تایبەت بە شوێنکەوتن و پێشبینیکردنی سووڕی مانگانە، بە تەواوی سەربەخۆ و بەبێ ئینتەرنێت." />
<link id="favicon" rel="icon" href="" />
<link id="manifestLink" rel="manifest" href="manifest.json" />
<meta id="themeColorMeta" name="theme-color" content="#D64D64" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta id="appleTitleMeta" name="apple-mobile-web-app-title" content="سووڕی مانگانە" />
<link id="appleIcon" rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root{
    --pink-50:#FFF1F2; --pink-100:#FEE2E2; --pink-500:#E11D48; --pink-600:#D64D64; --pink-700:#BE123C;
    --bg:#FEF7F7; --text:#2D2D2D; --card:#FFFFFF; --border:#FEE2E2; --muted:#78716c; --muted-2:#a8a29e;
    --emerald-bg:#ecfdf5; --emerald-text:#065f46; --emerald-border:#a7f3d0;
    --amber:#f59e0b; --rose-100:#ffe4e6; --rose-200:#fecdd3;
    --tint:#FAF1F2; --header-bg:rgba(254,247,247,.92); --nav-bg:rgba(255,255,255,.96); --overlay:rgba(28,25,23,.6);
    --stat-label:#44403c;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --pink-50:#3a2226; --pink-100:#4a262c; --pink-500:#fb7185; --pink-600:#f4485f; --pink-700:#fda4af;
    --bg:#1c1917; --text:#f2ede9; --card:#26211f; --border:#3d3532; --muted:#a39a95; --muted-2:#8a807b;
    --emerald-bg:#123024; --emerald-text:#6ee7b7; --emerald-border:#1f5c48;
    --amber:#fbbf24; --rose-100:#3a1f26; --rose-200:#5c2c37;
    --tint:#2a2422; --header-bg:rgba(28,25,23,.92); --nav-bg:rgba(38,33,31,.9); --overlay:rgba(0,0,0,.7);
    --stat-label:#e7e2df;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Tahoma,'Segoe UI','Noto Sans Arabic','Geeza Pro',Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  .app{min-height:100vh; display:flex; flex-direction:column; padding-bottom:96px;}
  .header{position:sticky; top:0; z-index:30; background:var(--header-bg); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); padding:14px 16px;}
  .header-inner{max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-icon{width:40px; height:40px; border-radius:16px; background:var(--pink-50); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--pink-600); flex-shrink:0;}
  .brand-title{font-weight:800; font-size:16px; margin:0;}
  .brand-sub{font-size:11px; color:var(--muted); margin:0; font-weight:500;}
  .btn{border:none; border-radius:16px; font-weight:700; font-size:13px; padding:10px 16px; transition:background .15s, transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--pink-600); color:#fff;}
  .btn-primary:hover{background:var(--pink-700);}
  .btn-ghost{background:var(--card); border:1px solid var(--border); color:var(--pink-600);}
  .btn-ghost:hover{background:var(--pink-50);}
  .btn-block{width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  main{max-width:720px; margin:0 auto; width:100%; padding:20px 16px 0; display:flex; flex-direction:column; gap:20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:32px; padding:24px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card-header{display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:16px;}
  h3{font-size:16px; font-weight:800; margin:0;}
  p{margin:0;}
  .text-xs{font-size:12px;}
  .text-muted{color:var(--muted);}
  .dial-wrap{display:flex; flex-direction:column; align-items:center; text-align:center;}
  .dial{position:relative; width:230px; height:230px; margin:8px 0;}
  .dial svg{transform:rotate(-90deg);}
  .dial-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .dial-label{font-size:12px; font-weight:700; color:var(--muted-2);}
  .dial-num{font-size:44px; font-weight:900; color:var(--pink-600); margin:2px 0;}
  .dial-of{font-size:12px; font-weight:700;}
  .feedback{padding:14px; background:var(--emerald-bg); border:1px solid var(--emerald-border); color:var(--emerald-text); font-size:12px; font-weight:700; border-radius:16px; display:flex; align-items:center; gap:8px;}
  .badge{padding:2px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid var(--emerald-border); background:var(--emerald-bg); color:var(--emerald-text);}
  .pill{background:var(--tint); padding:4px 12px; border-radius:16px; border:1px solid var(--border); font-size:12px; color:var(--pink-600); font-weight:700; white-space:nowrap;}
  .grid3{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:600px){.grid3{grid-template-columns:repeat(3,1fr);}}
  .stat{padding:16px; border-radius:16px; border:1px solid var(--border); background:var(--card);}
  .stat.tint{background:var(--tint);}
  .stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .stat-label{font-size:12px; font-weight:700; color:var(--stat-label);}
  .stat-chip{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--pink-600);}
  .stat-main{font-size:12px; font-weight:800;}
  .stat-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; padding:6px 0; font-size:12px; font-weight:700; color:var(--text);}
  .future-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px;}
  @media(min-width:520px){.future-grid{grid-template-columns:1fr 1fr;}}
  .future-item{padding:14px; border-radius:16px; background:var(--tint); border:1px solid var(--border); font-size:12px;}
  .future-item .row{display:flex; justify-content:space-between; font-weight:700; color:var(--pink-600);}
  .day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; text-align:center; font-size:12px;}
  .day-head{font-size:11px; font-weight:700; color:var(--muted-2); padding:4px 0;}
  .day-cell{padding:10px 2px; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid transparent; background:var(--tint); color:var(--stat-label); gap:3px;}
  .day-cell .dot{width:6px; height:6px; border-radius:999px; background:var(--amber);}
  .day-today{background:var(--pink-600); color:#fff; font-weight:800;}
  .day-period{background:var(--rose-100); color:var(--pink-600); font-weight:800; border-color:var(--rose-200);}
  .day-fertile{background:var(--emerald-bg); color:var(--emerald-text); border-color:var(--emerald-border);}
  .legend{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding-top:12px; border-top:1px solid var(--border); font-size:11px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot-lg{width:12px; height:12px; border-radius:999px; display:inline-block;}
  .hist-item{padding:14px; border-radius:16px; background:var(--tint); border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-size:12px;}
  .hist-item .date{font-weight:800; font-size:13px;}
  .hist-item .meta{color:var(--muted); font-size:11px; margin-top:2px;}
  .icon-btn{background:none; border:none; padding:8px; border-radius:12px; color:var(--muted-2);}
  .icon-btn:hover{background:var(--card); color:#b91c1c;}
  .settings-block{background:var(--tint); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px;}
  .settings-title{display:flex; align-items:center; gap:8px; font-weight:800; font-size:12px;}
  .slider-row{margin-bottom:16px;}
  .slider-top{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--stat-label); margin-bottom:4px;}
  .slider-top span.val{color:var(--pink-600);}
  input[type=range]{width:100%; accent-color:var(--pink-600);}
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .switch-row:last-child{border-bottom:none;}
  .switch-label{font-size:12px; font-weight:700;}
  .switch-desc{font-size:11px; color:var(--muted); margin-top:2px; max-width:80%;}
  .switch{position:relative; width:42px; height:24px; border-radius:999px; background:#e7e5e4; border:none; flex-shrink:0;}
  html[data-theme="dark"] .switch{background:#4a4340;}
  .switch.on{background:var(--pink-600);}
  .switch::after{content:''; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:999px; background:#fff; transition:transform .15s;}
  .switch.on::after{transform:translateX(-18px);}
  .field{width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--border); font-size:12px; background:var(--card); color:var(--text);}
  .field:focus{outline:2px solid var(--pink-600); outline-offset:1px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .modal-overlay{position:fixed; inset:0; z-index:50; background:var(--overlay); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{background:var(--card); width:100%; max-width:420px; border-radius:32px; padding:24px; border:1px solid var(--border); max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:16px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:12px;}
  .modal-close{background:none; border:none; color:var(--muted-2); font-weight:800; font-size:15px;}
  .flow-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; font-size:12px;}
  .flow-btn{padding:10px 4px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--stat-label); font-weight:700; font-size:12px;}
  .flow-btn.active{background:var(--pink-600); color:#fff; border-color:var(--pink-600);}
  textarea.field{resize:vertical;}
  .bottom-nav{position:fixed; bottom:12px; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0 16px;}
  .bottom-nav-inner{background:var(--nav-bg); backdrop-filter:blur(6px); border-radius:999px; border:1px solid var(--border); box-shadow:0 4px 16px rgba(0,0,0,.08); padding:6px; display:flex; align-items:center; justify-content:space-around; gap:2px; max-width:420px; width:100%;}
  .nav-btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 10px; border-radius:999px; background:none; border:none; color:var(--muted-2);}
  .nav-btn.active{color:var(--pink-600); background:var(--pink-50);}
  .nav-btn span{font-size:10px; font-weight:700;}
  /* Onboarding & lock screens */
  .full-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .onb-card{max-width:420px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:32px; padding:32px 28px; text-align:center; display:flex; flex-direction:column; gap:18px;}
  .onb-icon{width:64px; height:64px; border-radius:20px; background:var(--pink-50); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--pink-600); margin:0 auto;}
  .onb-title{font-size:18px; font-weight:900;}
  .onb-text{font-size:13px; color:var(--muted); line-height:1.7;}
  .dots{display:flex; justify-content:center; gap:6px; margin-top:4px;}
  .step-dot{width:6px; height:6px; border-radius:999px; background:var(--border);}
  .step-dot.on{background:var(--pink-600); width:18px;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto; width:100%;}
  .key{padding:18px 0; font-size:20px; font-weight:800; border-radius:20px; background:var(--card); border:1px solid var(--border); color:var(--text);}
  .key:active{background:var(--pink-50);}
  .pin-dots{display:flex; justify-content:center; gap:12px; margin:8px 0;}
  .pin-dot{width:14px; height:14px; border-radius:999px; border:2px solid var(--pink-600); background:transparent;}
  .pin-dot.filled{background:var(--pink-600);}
  .pin-error{color:var(--pink-700); font-size:12px; font-weight:700; min-height:16px;}
  .link-btn{background:none; border:none; color:var(--pink-600); font-size:12px; font-weight:700; text-decoration:underline;}
  .segment{display:flex; gap:6px; margin-top:10px;}
  .segment button{flex:1; padding:9px 0; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:12px; font-weight:700; color:var(--text); display:flex; align-items:center; justify-content:center; gap:6px;}
  .segment button.active{background:var(--pink-600); color:#fff; border-color:var(--pink-600);}
  .notice-flag{padding:14px 16px; background:var(--tint); border:1px solid var(--border); border-radius:20px; font-size:12px; font-weight:600; color:var(--text); display:flex; gap:10px; align-items:flex-start; line-height:1.7;}
  .notice-flag .ic{color:var(--amber); flex-shrink:0; margin-top:1px;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  @media(prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>

/* ---------------- KURDISH UTILS ---------------- */
var KURDISH_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
var KURDISH_SOLAR_MONTHS = ['خاکەلێوە','گوڵان','جۆزەردان','پووشپەڕ','گەلاوێژ','خەرمانان','ڕەزبەر','گەڵاڕێزان','سەرماوەز','بەفرانبار','ڕێبەندان','ڕەشەمە'];
var KURDISH_WEEKDAYS = ['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'];

function formatKurdishNumber(num, useKurdish){
  if(num===null||num===undefined) return '';
  var str = String(num);
  if(!useKurdish) return str;
  return str.replace(/\d/g, function(d){ return KURDISH_DIGITS[parseInt(d,10)]; });
}
function toISODateString(date){
  var d = new Date(date);
  var year = d.getFullYear();
  var month = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return year+'-'+month+'-'+day;
}
function addDaysToDate(dateStr, days){
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  dt.setDate(dt.getDate()+days);
  return toISODateString(dt);
}
function getDaysDifference(startStr, endStr){
  var a = startStr.split('-').map(Number), b = endStr.split('-').map(Number);
  var d1 = new Date(a[0],a[1]-1,a[2]), d2 = new Date(b[0],b[1]-1,b[2]);
  return Math.round((d2.getTime()-d1.getTime())/86400000);
}
function formatKurdishDate(dateStr, opts){
  if(!dateStr) return '';
  opts = opts || {};
  var includeDayName = opts.includeDayName, short = opts.short, useKurdishDigits = opts.useKurdishDigits !== false;
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  var dayName = KURDISH_WEEKDAYS[dt.getDay()];
  var monthName = KURDISH_SOLAR_MONTHS[p[1]-1];
  var dayNum = formatKurdishNumber(p[2], useKurdishDigits);
  var yearNum = formatKurdishNumber(p[0], useKurdishDigits);
  if(short) return dayNum+'ی '+monthName;
  if(includeDayName) return dayName+'، '+dayNum+'ی '+monthName+'ی '+yearNum;
  return dayNum+'ی '+monthName+'ی '+yearNum;
}

/* ---------------- PREDICTION ENGINE (unchanged logic) ---------------- */
function calculatePredictions(cycles, settings, todayStr){
  todayStr = todayStr || toISODateString(new Date());
  var fallbackCycle = settings.averageCycleLength || 28;
  var fallbackPeriod = settings.averagePeriodDuration || 5;
  var luteal = settings.lutealPhaseDuration || 14;

  var sortedDesc = cycles.slice().sort(function(a,b){ return b.startDate.localeCompare(a.startDate); });
  var sortedAsc = cycles.slice().sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });

  var intervals = [];
  for(var i=0;i<sortedAsc.length-1;i++){
    var diff = getDaysDifference(sortedAsc[i].startDate, sortedAsc[i+1].startDate);
    if(diff>=18 && diff<=65) intervals.push(diff);
  }
  var durations = [];
  sortedDesc.forEach(function(c){
    var dur = c.periodDuration;
    if(!dur && c.endDate) dur = Math.max(1, getDaysDifference(c.startDate, c.endDate)+1);
    if(dur && dur>=1 && dur<=14) durations.push(dur);
  });

  var predictedCycle = fallbackCycle, variance = 0;
  if(intervals.length>0){
    var rev = intervals.slice().reverse();
    var totalW=0,sumW=0;
    rev.forEach(function(val,idx){ var w=Math.max(1,4-idx); sumW+=val*w; totalW+=w; });
    predictedCycle = Math.round(sumW/totalW);
    var mean = intervals.reduce(function(a,b){return a+b;},0)/intervals.length;
    variance = intervals.reduce(function(s,v){return s+Math.pow(v-mean,2);},0)/intervals.length;
  }
  var predictedDuration = fallbackPeriod;
  if(durations.length>0){
    var tW=0,sW=0;
    durations.forEach(function(d,idx){ var w=Math.max(1,3-idx); sW+=d*w; tW+=w; });
    predictedDuration = Math.max(1, Math.round(sW/tW));
  }
  var stdDev = Math.sqrt(variance);
  var confidenceScore=70, confidenceLevel='low';
  var confidenceText = 'پێشبینییەکە بەپێی کاتی پێوانەیی دیاریکراوە. بە تۆمارکردنی سووڕی زیاتر وردتر دەبێت.';
  if(sortedDesc.length>=4 && stdDev<=2.5){
    confidenceScore=96; confidenceLevel='high';
    confidenceText = 'پێشبینیی زۆر ورد بەپێی چەندین سووڕی ڕابردووت (تێکڕا: '+predictedCycle+' ڕۆژ).';
  } else if(sortedDesc.length>=3 && stdDev<=3.5){
    confidenceScore=90; confidenceLevel='high';
    confidenceText = 'پێشبینیی باوەڕپێکراو بەپێی ٣ سووڕی ڕابردووت.';
  } else if(sortedDesc.length>=2){
    confidenceScore = stdDev>4 ? 75 : 84; confidenceLevel='medium';
    confidenceText = stdDev>4 ? 'سووڕەکانت کەمێک ناڕێکییان تێدایە، پێشبینی نزیکترین کات دیاریدەکات.' : 'پێشبینیی مامناوەند بەپێی سووڕە تۆمارکراوەکانت.';
  } else if(sortedDesc.length===1){
    confidenceScore=78; confidenceLevel='medium';
    confidenceText = 'پێشبینیی سەرەتایی بەپێی ١ سووڕی تۆمارکراو.';
  }

  var baseStart = sortedDesc[0] ? sortedDesc[0].startDate : todayStr;
  var cycleOffset=1;
  var testNext = addDaysToDate(baseStart, predictedCycle);
  var guard=0;
  while(getDaysDifference(testNext, todayStr) > predictedDuration+7 && guard<500){
    testNext = addDaysToDate(testNext, predictedCycle);
    cycleOffset++; guard++;
  }
  var nextPeriodStart = addDaysToDate(baseStart, cycleOffset*predictedCycle);
  var nextPeriodEnd = addDaysToDate(nextPeriodStart, predictedDuration-1);
  var ovulationDate = addDaysToDate(nextPeriodStart, -luteal);
  var fertileWindowStart = addDaysToDate(ovulationDate, -5);
  var fertileWindowEnd = addDaysToDate(ovulationDate, 1);
  var daysUntilNextPeriod = getDaysDifference(todayStr, nextPeriodStart);

  var futureCycles = [];
  for(var k=1;k<=4;k++){
    var fStart = addDaysToDate(baseStart, (cycleOffset+k-1)*predictedCycle);
    var fEnd = addDaysToDate(fStart, predictedDuration-1);
    var fNextStart = addDaysToDate(fStart, predictedCycle);
    var fOv = addDaysToDate(fNextStart, -luteal);
    futureCycles.push({
      cycleIndex:k, startDate:fStart, endDate:fEnd, ovulationDate:fOv,
      fertileWindowStart:addDaysToDate(fOv,-5), fertileWindowEnd:addDaysToDate(fOv,1),
      periodDuration:predictedDuration, cycleLength:predictedCycle
    });
  }
  return {
    nextPeriodStart:nextPeriodStart, nextPeriodEnd:nextPeriodEnd, periodDuration:predictedDuration,
    cycleLength:predictedCycle, ovulationDate:ovulationDate, fertileWindowStart:fertileWindowStart,
    fertileWindowEnd:fertileWindowEnd, daysUntilNextPeriod:daysUntilNextPeriod, confidenceScore:confidenceScore,
    confidenceLevel:confidenceLevel, confidenceText:confidenceText, basedOnCyclesCount:sortedDesc.length,
    varianceDays:Math.round(stdDev*10)/10, futureCycles:futureCycles
  };
}

var darkModeQuery = (window.matchMedia) ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function resolveTheme(){
  var mode = S.settings.themeMode || 'auto';
  if(mode==='light') return 'light';
  if(mode==='dark') return 'dark';
  return (darkModeQuery && darkModeQuery.matches) ? 'dark' : 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
}

};

  var onSystemThemeChange = function(){ if((S.settings.themeMode||'auto')==='auto'){ applyTheme(); } };
  if(darkModeQuery.addEventListener) darkModeQuery.addEventListener('change', onSystemThemeChange);
  else if(darkModeQuery.addListener) darkModeQuery.addListener(onSystemThemeChange);
}

/* Apply discreet mode to tab title / favicon / home-screen identity.
   NOTE ON THE BUG: previously this only touched the browser-tab favicon, which is NOT
   what iOS/Android read when you tap "Add to Home Screen" or "Install" — those read the
   apple-touch-icon tag and the manifest.json file, which we now update live too. */
var lastChromeSignature = '';
var lastManifestBlobUrl = null;
function applyChrome(){
  applyTheme();
  var discreet = S.settings.isDiscreetModeEnabled;
  var title = discreet ? (S.settings.discreetLabel || 'تێبینیەکان') : 'سووڕی مانگانە';
  var themeColor = discreet ? '#787066' : '#D64D64';
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('appleTitleMeta').setAttribute('content', title);
  document.getElementById('themeColorMeta').setAttribute('content', themeColor);

  var svg = discreet
    ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23787066" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23D64D64"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>';
  document.getElementById('favicon').setAttribute('href', 'data:image/svg+xml,'+svg);

  /* apple-touch-icon: iOS reads whatever is live in the DOM the moment "Add to Home
     Screen" is tapped, so this now correctly reflects discreet mode if it's turned on
     BEFORE you add the icon. If you already added the icon earlier, remove it from your
     home screen and re-add it after enabling discreet mode — iOS won't retroactively
     update an icon that's already installed. */
  document.getElementById('appleIcon').setAttribute('href', discreet ? 'icons/apple-touch-icon-discreet.png' : 'icons/apple-touch-icon.png');

  var signature = discreet+'|'+title+'|'+resolveTheme();
  if(signature===lastChromeSignature) return;
  lastChromeSignature = signature;

  /* manifest.json is what Android/Chrome's "Install" prompt reads. A static file can't
     change per-user, so we swap it for a generated one that matches current settings.
     Same caveat as iOS applies: Android bakes the name/icon into the installed app at
     install time, so changing discreet mode afterward means reinstalling to update it. */
  try{
    var manifest = {
      name: title, short_name: title.length>12 ? title.slice(0,12) : title,
      start_url:'./', scope:'./', display:'standalone', dir:'rtl', lang:'ckb',
      background_color:(resolveTheme()==='dark') ? '#1c1917' : '#FEF7F7',
      theme_color: themeColor,
      icons:[
        {src:discreet?'icons/icon-192-discreet.png':'icons/icon-192.png', sizes:'192x192', type:'image/png', purpose:'any'},
        {src:discreet?'icons/icon-512-discreet.png':'icons/icon-512.png', sizes:'512x512', type:'image/png', purpose:'any'}
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    var url = URL.createObjectURL(blob);
    document.getElementById('manifestLink').setAttribute('href', url);
    if(lastManifestBlobUrl) URL.revokeObjectURL(lastManifestBlobUrl);
    lastManifestBlobUrl = url;
  }catch(e){ /* falls back to the static manifest.json file on the server */ }
}

function getPrediction(){ return calculatePredictions(S.cycles, S.settings, todayStr()); }

/* ---------------- NOTIFICATIONS ----------------
   Honest scope: this shows a real local notification the moment the app is opened,
   if a period is due today or tomorrow and permission was granted. It is NOT true
   background push (a notification firing while the app is fully closed for days) —
   that requires a push server (Web Push + VAPID keys), which is a real backend and
   outside what a single static site can do. This covers the achievable, reliable part:
   open the app (or have it running as an installed PWA in the background tab) → get
   notified if something's due, once per day, no repeats. */
function checkAndNotify(){
  if(!S.settings.notificationsEnabled) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(S.cycles.length===0) return;
  var prediction = getPrediction();
  var due = prediction.daysUntilNextPeriod>=0 && prediction.daysUntilNextPeriod<=1;
  if(!due) return;
  var key = todayStr();
  if(S.settings.lastNotifiedDate===key) return;
  var discreet = S.settings.isDiscreetModeEnabled;
  var title = discreet ? (S.settings.discreetLabel||'تێبینیەکان') : 'ئاگادارکردنەوەی سووڕ';
  var body = prediction.daysUntilNextPeriod===0
    ? 'پێشبینی دەکرێت سووڕەکەت ئەمڕۆ دەست پێبکات.'
    : 'پێشبینی دەکرێت سووڕەکەت بەیانی دەست پێبکات.';
  var iconPath = discreet ? 'icons/icon-192-discreet.png' : 'icons/icon-192.png';
  var sent = false;
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(function(reg){
      reg.showNotification(title, {body:body, icon:iconPath, dir:'rtl', tag:'period-reminder'});
    }).catch(function(){ try{ new Notification(title, {body:body}); }catch(e){} });
    sent = true;
  } else {
    try{ new Notification(title, {body:body}); sent = true; }catch(e){}
  }
  if(sent){ S.settings.lastNotifiedDate = key; persist(); }
}
window.toggleNotifications = function(){
  if(S.settings.notificationsEnabled){
    S.settings.notificationsEnabled = false;
    persist(); render();
    return;
  }
  if(!('Notification' in window)){
    showNotice('وێبگەڕەکەت پشتگیری ئاگادارکردنەوە ناکات.');
    return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm==='granted'){
      S.settings.notificationsEnabled = true;
      persist();
      showNotice('ئاگادارکردنەوەکان چالاککران.');
      checkAndNotify();
    } else {
      showNotice('ڕێگەت نەدرا بە ئاگادارکردنەوە. لە ڕێکخستنی وێبگەڕەکەت دەتوانیت بیگۆڕیت.');
    }
    render();
  });
};

    '<div class="modal-head"><h3>تۆماری ڕۆژی '+formatKurdishDate(d,{short:true,useKurdishDigits:S.settings.useKurdishNumerals})+'</h3>'+
    '<button class="modal-close" onclick="closeLogModal()">✕</button></div>'+
    '<div><div class="text-xs" style="font-weight:700;margin-bottom:6px;">خوێنبەربوون</div><div class="flow-grid">'+flowBtns+'</div></div>'+
    '<div><div class="text-xs" style="font-weight:700;margin-bottom:6px;">تێبینی تایبەت</div>'+
    '<textarea class="field" rows="3" placeholder="هەر هەستێک یان نیشانەیەک بنووسە..." onblur="setNote(this.value)">'+(log.note||'')+'</textarea></div>'+
    '<button class="btn btn-primary btn-block" onclick="closeLogModal()">داخستن و پاشەکەوت</button>'+
    '</div></div>';
}

function renderNav(){
  var tabs = [
    {id:'home', label:'سەرەتا', icon:'droplet_o'},
    {id:'calendar', label:'ڕۆژمێر', icon:'calendar'},
    {id:'history', label:'مێژوو', icon:'history'},
    {id:'tips', label:'زانیاری', icon:'book'},
    {id:'settings', label:'ڕێکخستن', icon:'settings'}
  ];
  var html = '<nav class="bottom-nav"><div class="bottom-nav-inner">';
  tabs.forEach(function(t){
    html += '<button class="nav-btn '+(S.activeTab===t.id?'active':'')+'" onclick="setTab(\''+t.id+'\')">'+icon(t.icon)+'<span>'+t.label+'</span></button>';
  });
  html += '</div></nav>';
  return html;
}

/* ---------------- HANDLERS ---------------- */
window.setTab = function(id){ S.activeTab = id; S.showFutureForecast = false; render(); };
window.openLogModal = function(dateStr){ S.selectedDate = dateStr; S.isLogModalOpen = true; render(); };
window.closeLogModal = function(){ S.isLogModalOpen = false; render(); persist(); showNotice('نیشانەکانی ئەمڕۆ پاشەکەوت کران.'); };
window.setFlow = function(f){
  var d = S.selectedDate;
  S.dailyLogs[d] = Object.assign({}, S.dailyLogs[d]||{}, {flow:f});
  render();
};
window.setNote = function(v){
  var d = S.selectedDate;
  S.dailyLogs[d] = Object.assign({}, S.dailyLogs[d]||{}, {note:v});
};
window.toggleForecast = function(){ S.showFutureForecast = !S.showFutureForecast; render(); };
window.togglePeriodToday = function(){
  var prediction = getPrediction();
  var latest = getLatestCycle();
  var daysSinceStart = latest ? Math.max(1, getDaysDifference(latest.startDate, todayStr())+1) : 1;
  var isBleedingToday = !!latest && daysSinceStart <= (prediction.periodDuration||5);
  if(isBleedingToday){
    showNotice('سووڕی مانگانەت وەک چالاک تۆمارکراوە.');
  } else {
    var newCycle = { id:'c_'+Date.now(), startDate:todayStr(), endDate:addDaysToDate(todayStr(), (prediction.periodDuration||5)-1), cycleLength:prediction.cycleLength||28, periodDuration:prediction.periodDuration||5 };
    S.cycles = [newCycle].concat(S.cycles);
    persist();
    showNotice('دەستپێکی سووڕی نوێ بۆ ئەمڕۆ تۆمارکرا!');
  }
};
window.deleteCycle = function(id){
  if(!confirm('دڵنیایت لە سڕینەوەی ئەم سووڕە؟')) return;
  S.cycles = S.cycles.filter(function(c){ return c.id!==id; });
  persist();
  showNotice('سووڕەکە سڕایەوە.');
};
window.liveSlider = function(labelId, val, suffix){
  document.getElementById(labelId).textContent = kNum(val)+suffix;
};
window.commitSetting = function(key, val){
  S.settings[key] = val;
  persist();
};
window.toggleSetting = function(key){
  S.settings[key] = !S.settings[key];
  persist();
  render();
};
window.togglePinLock = function(){
  if(S.settings.isPinLockEnabled){
    S.settings.isPinLockEnabled = false;
    S.settings.pinCode = '';
    persist();
    render();
  } else {
    S.pinSetupStage = 'new';
    S.pinSetupFirst = '';
    S.pinError = '';
    render();
  }
};
window.startPinChange = function(){ S.pinSetupStage='new'; S.pinSetupFirst=''; S.pinError=''; render(); };
window.handlePinSetupInput = function(val){
  val = val.replace(/\D/g,'').slice(0,4);
  if(val.length<4) return;
  if(S.pinSetupStage==='new'){
    S.pinSetupFirst = val;
    S.pinSetupStage = 'confirm';
    S.pinError = '';
    render();
  } else if(S.pinSetupStage==='confirm'){
    if(val===S.pinSetupFirst){
      S.settings.pinCode = val;
      S.settings.isPinLockEnabled = true;
      S.pinSetupStage = null;
      persist();
      showNotice('کۆدی PIN بە سەرکەوتوویی هەڵگیرا.');
    } else {
      S.pinError = 'کۆدەکان وەک یەک نین، دووبارە هەوڵبدەوە';
      S.pinSetupStage = 'new';
      S.pinSetupFirst = '';
      render();
    }
  }
};
window.resetAllData = function(){
  if(!confirm('دڵنیایت؟ هەموو داتاکانت (سووڕەکان، تۆمارەکان، ڕێکخستنەکان) بۆ هەمیشە دەسڕدرێنەوە.')) return;
  localStorage.removeItem('kurdish_pt_settings');
  localStorage.removeItem('kurdish_pt_cycles');
  localStorage.removeItem('kurdish_pt_logs');
  location.reload();
};
window.obNext = obNext;
window.obSkip = obSkip;
window.finishOnboarding = finishOnboarding;
window.pinPress = pinPress;
window.pinBackspace = pinBackspace;
window.S = S; // exposed for inline handlers reading/writing draft fields

/* Re-lock when the app is hidden/backgrounded, so reopening it requires the PIN again.
   Bug fix: the state was being changed but render() was never called, so the screen
   just stayed on whatever tab was open instead of showing the lock screen. */
function lockIfNeeded(){
  if(S.settings.isPinLockEnabled && S.settings.onboarded && S.view==='app'){
    S.sessionUnlocked = false;
    S.view = 'lock';
    S.pinInput = '';
    S.isLogModalOpen = false;
    render();
  }
}
document.addEventListener('visibilitychange', function(){ if(document.hidden) lockIfNeeded(); });
window.addEventListener('pagehide', lockIfNeeded); // extra safety net, iOS Safari in particular

render();
if(S.view==='app') checkAndNotify();
})();
</script>
</body>
